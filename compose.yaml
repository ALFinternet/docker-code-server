#
# For github integration, drop your ssh key in to /config/.ssh. Then open a terminal from the top menu and set your github username and email via the following commands
# git config --global user.name "username"
# git config --global user.email "email address"
#

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=${PASSWORD} #optional
      - HASHED_PASSWORD=${HASHED_PASSWORD} #optional - https://github.com/coder/code-server/blob/main/docs/FAQ.md#can-i-store-my-password-hashed
      - SUDO_PASSWORD=${SUDO_PASSWORD} #optional
      - SUDO_PASSWORD_HASH=${SUDO_PASSWORD_HASH} #optional - https://github.com/coder/code-server/blob/main/docs/FAQ.md#can-i-store-my-password-hashed
      - PROXY_DOMAIN=${PROXY_DOMAIN} #optional
      - DEFAULT_WORKSPACE=/config/workspace #optional
      - PWA_APPNAME=code-server #optional
    volumes:
      - ${APPDATA}/code-server:/config
#    ports:
#      - 8443:8443
    restart: unless-stopped
    networks:
      - default
#
#
#
networks:
  default:
    name: ${CONNET}
    external: true
